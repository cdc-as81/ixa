name: Benchmark Pull Requests

on:
  pull_request:
  workflow_dispatch:

jobs:
  compare-branches:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          # This fetches all branches so we can compare the PR branch with the base branch
          fetch-depth: 0

      - name: Create a benchmark baseline
        run: mise run bench:create '' base || echo "Could not create baseline"

      - name: Checkout PR branch
        # The checkout is done manually to avoid cleaning up the baseline benchmark
        run: git checkout ${{ github.event.pull_request.head.ref }}

      - name: Run hyperfine benchmarks
        run:
          mise run bench:hyperfine -- -- --export-markdown hyperfine.md
          --export-json hyperfine.json

      - name: Run criterion benchmarks (baseline compare)
        run: |
          set -euo pipefail
          if cargo bench -p ixa-bench -- --baseline base 2>&1 | tee criterion-compare.txt; then
            cargo run -q -p ixa-bench --bin check_criterion_regressions | tee criterion-regressions.txt
          else
            echo "Note: A comparison could not be generated. Maybe you added new benchmarks?" | tee criterion-regressions.txt
            mise run bench:criterion 2>&1 | tee -a criterion-compare.txt
          fi

      - name: Format PR comment
        run: |
          set -euo pipefail
          echo '### Benchmark Results' > results.md
          echo '' >> results.md
          echo '#### Hyperfine' >> results.md
          echo '' >> results.md
          echo '```' >> results.md
          cat hyperfine.md >> results.md
          echo '```' >> results.md
          echo '' >> results.md
          echo '#### Criterion' >> results.md
          echo '' >> results.md
          echo '```' >> results.md
          cat criterion-regressions.txt >> results.md
          echo '```' >> results.md

      - name: Add comment to PR
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file results.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download previous bench history from gh-pages (best effort)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fetches raw JSON directly from the gh-pages branch.
          # If it doesn't exist yet, we continue with an empty history.
          if gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/contents/bench-history.json?ref=gh-pages" \
            --jq '.content' > bench-history.b64 2>/dev/null; then
            base64 -d bench-history.b64 > bench-history.json
            echo "Downloaded bench-history.json from gh-pages"
          else
            echo "No bench-history.json found on gh-pages (first run?)."
          fi

      - name: Create JSON results
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_BRANCH:
            ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/bench_results.js \
            --repo "${GITHUB_REPOSITORY}" \
            --branch "${RUN_BRANCH}" \
            --pr-number "${PR_NUMBER}" \
            --base-ref "${BASE_REF}" --base-sha "${BASE_SHA}" \
            --head-ref "${HEAD_REF}" --head-sha "${HEAD_SHA}" \
            --hyperfine-json hyperfine.json \
            --criterion-log criterion-compare.txt \
            --history-in bench-history.json \
            --out-current bench-current.json \
            --history-out bench-history.json

      # - name: Print JSON results (bench-current.json + bench-history.json)
      #   run: |
      #     set -euo pipefail
      #     echo "bench-current.json (bytes): $(wc -c < bench-current.json)"
      #     echo "--- bench-current.json ---"
      #     # Pretty-print for readability in logs; falls back to raw if python isn't present.
      #     (python3 -m json.tool bench-current.json) || cat bench-current.json
      #     echo "--- end bench-current.json ---"
      #     echo "bench-history.json (bytes): $(wc -c < bench-history.json)"
      #     echo "--- bench-history.json ---"
      #     (python3 -m json.tool bench-history.json) || cat bench-history.json
      #     echo "--- end bench-history.json ---"

      # - name: Upload JSON results artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: bench-current
      #     if-no-files-found: error
      #     path: |
      #       bench-current.json
      #       bench-history.json
      #       results.md
      #       hyperfine.md
      #       hyperfine.json
      #       criterion-regressions.txt
      #       criterion-compare.txt

      # - name: Upload bench history artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: bench-history
      #     if-no-files-found: error
      #     path: |
      #       bench-history.json

      - name: Publish bench-history.json to gh-pages
        if:
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf gh-pages
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          cp bench-history.json gh-pages/bench-history.json
          pushd gh-pages >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git diff doesn't consider untracked files; use status to detect any change.
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to bench-history.json"
            exit 0
          fi
          git add bench-history.json
          git commit -m "Update bench-history.json"
          git push
          popd >/dev/null
